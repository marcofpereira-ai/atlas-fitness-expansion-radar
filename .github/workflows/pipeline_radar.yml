name: Pipeline Radar Atlas Fitness

on:
  schedule:
    # Execução mensal todo dia 05 às 06:00 UTC
    - cron: '0 6 5 * *'
  workflow_dispatch:
    # Permite execução manual via API/n8n
    inputs:
      ref:
        description: 'Branch to run (default: main)'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - develop

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: INFO
      OUTPUT_DIR: output
      REQUEST_TIMEOUT: 30
      RATE_LIMIT_SLEEP: 0.35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python -m src.main

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: output/quality_report.json
          retention-days: 30

      - name: Upload Parquet outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-parquet-outputs
          path: |
            output/gold_ranking_expansao/
            output/gold_contexto_macro/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Pipeline Radar Atlas Fitness - Execução" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          if [ -f output/quality_report.json ]; then
            python -c "
import json
with open('output/quality_report.json') as f:
    r = json.load(f)
print(f'| Status | {r[\"status\"]} |')
print(f'| Executado em | {r[\"executed_at\"]} |')
print(f'| Total municípios Brasil | {r[\"summary\"][\"total_municipios_brasil\"]} |')
print(f'| Municípios elegíveis (≥50k) | {r[\"summary\"][\"municipios_elegiveis_ranking\"]} |')
print(f'| Meses macroeconomia | {r[\"summary\"][\"meses_macroeconomia\"]} |')
print(f'| Registros fato municipal | {r[\"summary\"][\"registros_fato_municipal\"]} |')
print(f'| Registros fato macroeconomia | {r[\"summary\"][\"registros_fato_macroeconomia\"]} |')
"
          fi